<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Find Your Congressional District & Representative</title>
<style>
  body { font-family: system-ui, sans-serif; background:#f5f6f7; padding:2rem; }
  .widget { background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.1);
            max-width:480px; margin:auto; padding:1.5rem; }
  h2 { margin-top:0; }
  input[type=text] { width:100%; padding:.6rem .8rem; border:1px solid #ccc; border-radius:6px; font-size:1rem; }
  button { margin-top:.8rem; padding:.6rem 1.2rem; border:none; background:#0078d7; color:#fff;
           border-radius:6px; font-size:1rem; cursor:pointer; }
  button:hover { background:#005fa3; }
  .result { margin-top:1rem; font-size:1rem; line-height:1.5; }
  .loading { color:#777; }
  .error { color:#c00; }
  .rep-card { background:#f0f3f8; padding:.8rem; border-radius:8px; margin-top:.5rem; }
</style>
</head>
<body>

<div class="widget">
  <h2>Find Your Congressional District & Representative</h2>
  <input id="address" type="text" placeholder="Enter your full street address">
  <button id="lookup">Lookup</button>
  <div id="output" class="result"></div>
</div>

<script>
// === INSERT YOUR GOOGLE CIVIC API KEY HERE ===
const GOOGLE_API_KEY = "YOUR_API_KEY_HERE";

async function getDistrict(address) {
  const base = "https://geocoding.geo.census.gov/geocoder/geographies/onelineaddress";
  const params = new URLSearchParams({
    address,
    benchmark: "Public_AR_Current",
    vintage: "Current_Current",
    format: "json"
  });
  const res = await fetch(`${base}?${params}`);
  if (!res.ok) throw new Error(`Census geocoder error ${res.status}`);
  const data = await res.json();
  const matches = data?.result?.addressMatches;
  if (!matches?.length) return null;
  const geogs = matches[0].geographies || {};
  const cdGroups = Object.keys(geogs).filter(k => k.startsWith("Congressional District"));
  const cdArr = cdGroups.length ? geogs[cdGroups[0]] : [];
  if (!cdArr?.length) return null;
  const cd = cdArr[0];
  return {
    name: cd.NAME || "",
    district: cd.CD118 || cd.CD116 || cd.BASENAME || "",
    state: cd.STATE || cd.STATE_NAME || ""
  };
}

async function getRepresentative(address) {
  const base = "https://www.googleapis.com/civicinfo/v2/representatives";
  const params = new URLSearchParams({ address, key: GOOGLE_API_KEY });
  const res = await fetch(`${base}?${params}`);
  if (!res.ok) throw new Error(`Civic API error ${res.status}`);
  const data = await res.json();
  // Filter for US House of Representatives
  const offices = data.offices || [];
  const officials = data.officials || [];
  const repOffices = offices.filter(o => o.name.includes("United States House"));
  if (!repOffices.length) return null;
  const rep = officials[repOffices[0].officialIndices[0]];
  return {
    name: rep.name,
    party: rep.party,
    phones: rep.phones,
    urls: rep.urls
  };
}

async function lookup() {
  const address = document.getElementById("address").value.trim();
  const output = document.getElementById("output");
  if (!address) return (output.textContent = "Please enter an address.");
  output.className = "result loading";
  output.textContent = "Looking up your district and representative...";
  try {
    const [cd, rep] = await Promise.all([
      getDistrict(address),
      getRepresentative(address)
    ]);
    if (!cd) throw new Error("No congressional district found for that address.");

    let html = `<strong>${cd.name}</strong><br>State: ${cd.state || "(unknown)"}<br>District #: ${cd.district || "(unknown)"}`;

    if (rep) {
      html += `
        <div class="rep-card">
          <strong>${rep.name}</strong><br>
          Party: ${rep.party}<br>
          ${rep.phones ? "📞 " + rep.phones[0] + "<br>" : ""}
          ${rep.urls ? `🌐 <a href="${rep.urls[0]}" target="_blank">${rep.urls[0]}</a>` : ""}
        </div>`;
    } else {
      html += `<div class="rep-card">No representative info found.</div>`;
    }

    output.className = "result";
    output.innerHTML = html;
  } catch (e) {
    output.className = "result error";
    output.textContent = "Error: " + e.message;
  }
}

document.getElementById("lookup").addEventListener("click", lookup);
document.getElementById("address").addEventListener("keypress", e => {
  if (e.key === "Enter") lookup();
});
</script>

</body>
</html>
